name: Desktop Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (example: v0.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_script: package:linux
          - os: macos-latest
            package_script: package:mac
          - os: windows-latest
            package_script: package:win

    runs-on: ${{ matrix.os }}

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    defaults:
      run:
        working-directory: desktop-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.package_script }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: de-droid-${{ matrix.os }}
          path: |
            desktop-app/release/*.AppImage
            desktop-app/release/*.deb
            desktop-app/release/*.dmg
            desktop-app/release/*.zip
            desktop-app/release/*.exe
            desktop-app/release/*.msi
            desktop-app/release/*.blockmap
            desktop-app/release/latest*.yml

  attach-assets:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: build-and-release

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Ensure release exists for manual dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "De-Droid $RELEASE_TAG" --notes "Manual release build"
          fi

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.blockmap
            release-assets/latest*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
